# Hooks are declared as `repo: local` with PyPI dependencies so they install
# without cloning GitHub repositories (works behind restrictive networks).
# Setup once: pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: python
        additional_dependencies: ["ruff==0.17.0"]
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: python
        additional_dependencies: ["ruff==0.17.0"]
        types_or: [python, pyi]
      - id: check-yaml
        name: check yaml
        entry: check-yaml
        language: python
        additional_dependencies: ["pre-commit-hooks==6.0.0"]
        types: [yaml]
      - id: end-of-file-fixer
        name: fix end of files
        entry: end-of-file-fixer
        language: python
        additional_dependencies: ["pre-commit-hooks==6.0.0"]
        types: [text]
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: trailing-whitespace-fixer
        language: python
        additional_dependencies: ["pre-commit-hooks==6.0.0"]
        types: [text]
        exclude: \.ipynb$
      - id: check-added-large-files
        name: block large files (data must never be committed)
        entry: check-added-large-files --maxkb=1000
        language: python
        additional_dependencies: ["pre-commit-hooks==6.0.0"]
