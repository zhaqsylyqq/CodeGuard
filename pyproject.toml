[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeguard"
version = "0.1.0"
description = "CodeGuard-LoRA: parameter-efficient fine-tuning of code LLMs for Python bug detection and fix generation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Zhaxylyk Abdimutalipov" }, { name = "Alrami Dandibay" }]
# Loose lower bounds here; exact pins live in requirements-*.txt.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "pydantic>=2.7",
    "typer>=0.12",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Tokenizer only (no torch): used for token-length statistics in EDA.
hf = ["transformers>=4.44", "tokenizers>=0.19"]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7", "jupyter", "nbconvert"]

[project.scripts]
codeguard = "codeguard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow non-ASCII in strings/comments

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
